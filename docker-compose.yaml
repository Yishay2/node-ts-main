services: 
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - my_network

  server:
    build: ./server

    ports:
      - 3005:3000

    depends_on:
      - redis
    networks:
      - my_network
    environment:
      - REDIS_HOST=redis
      - PORT=3000

  client:
    build: ./client

    ports:
      - 3001:80

    networks:
      - my_network

volumes:
  redis_data:

networks:
  my_network:
    driver: bridge